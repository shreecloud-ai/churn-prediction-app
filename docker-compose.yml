version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api     # your separate API Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    # depends_on: []                  # ← optional, only add if truly needed

  streamlit:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api                         # ← correct: dash + service name as string
    environment:
      - PYTHONUNBUFFERED=1